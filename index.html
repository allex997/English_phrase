<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажер ввода системных команд</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --accent: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      max-width: 1000px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Шапка */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--surface-border);
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }

    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    
    button, select, input {
      padding: 8px 14px;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    select, input { outline: none; }
    select:focus, input:focus { border-color: var(--primary); }
    
    button { cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    button.primary { background: var(--primary); color: #0f172a; border: none; font-weight: 600; }
    button.primary:hover { background: var(--primary-hover); color: white; }
    button.secondary:hover { background: var(--surface-border); }

    /* Панель тренажера */
    .trainer-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      padding: 32px;
      border-radius: 16px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .record-banner {
      display: none;
      background: rgba(251, 191, 36, 0.15);
      color: var(--warning);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0 auto 16px auto;
      width: fit-content;
      animation: fadeIn 0.3s ease;
    }
    .record-banner.active { display: block; }

    .target-phrase {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 1.5rem;
      background: #090d16;
      border: 1px solid var(--surface-border);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      color: var(--primary);
      word-break: break-all;
      letter-spacing: 0.5px;
    }

    .input-group { display: flex; gap: 10px; max-width: 650px; margin: 0 auto; }
    .input-group input {
      flex: 1;
      font-family: monospace;
      font-size: 1.1rem;
      padding: 12px 16px;
      background: #090d16;
    }

    .feedback-box {
      margin-top: 14px;
      font-weight: 500;
      min-height: 24px;
      font-size: 0.95rem;
    }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }

    .improvement-badge {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 14px;
      display: none;
    }
    .improvement-badge.active { display: block; }

    /* Дерево подгрупп */
    .tree-container {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      padding: 24px;
      border-radius: 16px;
    }

    .phrase-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .phrase-actions h2 { font-size: 1.1rem; font-weight: 600; }

    details {
      margin-top: 10px;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.6);
    }
    details details { margin-left: 12px; background: rgba(30, 41, 59, 0.4); }
    summary { cursor: pointer; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
    summary:hover { color: var(--text); }

    .item-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .item-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #090d16;
      border: 1px solid var(--surface-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.825rem;
      color: var(--text);
    }
    .item-chip button {
      padding: 2px 6px;
      font-size: 0.75rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
    }
    .item-chip button:hover { color: var(--primary); }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      padding: 28px;
      border-radius: 16px;
      width: 720px;
      max-width: 92%;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--surface-border);
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #090d16;
      border: 1px solid var(--surface-border);
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card .value { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    .stat-card .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 12px; }
    .stats-table th, .stats-table td { border: 1px solid var(--surface-border); padding: 10px; text-align: left; }
    .stats-table th { background: #090d16; color: var(--text-muted); }

    .progress-section {
      margin-top: 20px;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 10px;
      padding: 16px;
    }
    .progress-section h4 { color: var(--success); margin-bottom: 6px; font-size: 0.9rem; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Тренажер параметров</h1>
    <div class="controls">
      <button id="openStatsBtn" class="primary">📊 Статистика</button>
      <select id="modeSelect">
        <option value="all">Все подгруппы</option>
      </select>
      <select id="voiceSelect"><option>Голос...</option></select>
    </div>
  </header>

  <main>
    <div class="trainer-card">
      <div id="recordBanner" class="record-banner">🏆 Новый рекорд скорости!</div>
      <div id="targetDisplay" class="target-phrase">Нажмите "Старт"</div>
      <div class="input-group">
        <input type="text" id="userInput" placeholder="Вводите фразу..." disabled autocomplete="off" spellcheck="false">
        <button id="startBtn" class="primary">Старт</button>
      </div>
      <div id="feedback" class="feedback-box"></div>
      <div id="improvementBadge" class="improvement-badge"></div>
    </div>

    <div class="tree-container">
      <div class="phrase-actions">
        <h2>Структура подгрупп</h2>
        <div class="controls">
          <button id="exportPhrasesBtn" class="secondary">📥 Скачать JSON</button>
          <button id="importPhrasesBtn" class="secondary">📤 Загрузить JSON</button>
          <input type="file" id="phrasesFileInput" accept=".json" style="display: none;">
        </div>
      </div>
      <div id="tree"></div>
    </div>
  </main>

  <div class="modal" id="statsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Аналитика тренировки</h2>
        <button id="closeStatsBtn" style="border:none; background:none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>

      <div class="stats-summary">
        <div class="stat-card">
          <div class="value" id="statTotalTime">00:00</div>
          <div class="label">Время</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statCorrectWords">0</div>
          <div class="label">Успешно</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statWrongWords">0</div>
          <div class="label">Ошибок</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statAvgTime">0s</div>
          <div class="label">Ср. время</div>
        </div>
      </div>

      <div class="progress-section">
        <h4>📈 Преодоление частых ошибок</h4>
        <div id="improvedPhrasesList" style="font-size: 0.85rem; color: var(--text-muted);">
          Пока нет зафиксированного прогресса по частым ошибкам.
        </div>
      </div>

      <h3 style="margin-top: 20px; font-size: 1rem;">Детализация по фразам</h3>
      <table class="stats-table">
        <thead>
          <tr>
            <th>Фраза</th>
            <th>Успешно</th>
            <th>Ошибок</th>
            <th>Ср. время</th>
            <th>Рекорд</th>
          </tr>
        </thead>
        <tbody id="phrasesTableBody"></tbody>
      </table>

      <div style="margin-top: 24px; display: flex; justify-content: space-between; border-top: 1px solid var(--surface-border); padding-top: 16px; flex-wrap: wrap; gap: 10px;">
        <div class="controls">
          <button id="exportStatsBtn" class="secondary">📥 Экспорт статистики</button>
          <button id="importStatsBtn" class="secondary">📤 Импорт</button>
          <input type="file" id="statsFileInput" accept=".json" style="display: none;">
        </div>
        <button id="resetStatsBtn" style="color: var(--danger); border-color: rgba(248, 113, 113, 0.3);">Сброс</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Звук ошибки
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playErrorSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    // 2. Генерация данных
    function generateIndexedItems(prefix, count, isZeroBased = false) {
      const items = [];
      const start = isZeroBased ? 0 : 1;
      const end = isZeroBased ? count - 1 : count;
      for (let i = start; i <= end; i++) items.push(`${prefix}[${i}]`);
      return items;
    }

    const defaultTreeData = [
      {
        id: "group_system",
        title: "Системное состояние",
        items: ["r_state", "hsc_get_state_param_time_out", "hsc_read_calls", "hsc_st.size"]
      },
      {
        id: "group_3",
        title: "Группа 3: HSC Запросы",
        items: ["hsc_read_calls"],
        subgroups: [
          { id: "g3_addr", title: "Адреса (addr[38])", items: generateIndexedItems("hsc_read_param_addr", 38, true) },
          { id: "g3_size", title: "Размер (data_size[38])", items: generateIndexedItems("hsc_read_param_data_size", 38, true) },
          { id: "g3_val", title: "Значения (data_value[38])", items: generateIndexedItems("hsc_read_param_data_value", 38, true) },
          { id: "g3_dev", title: "ID устройств (id_dev[38])", items: generateIndexedItems("hsc_read_param_id_dev", 38, true) },
          { id: "g3_ptr", title: "Указатели (ptr_data[38])", items: generateIndexedItems("hsc_read_param_ptr_data_read_in", 38, true) },
          { id: "g3_out", title: "Таймаут (time_out[38])", items: generateIndexedItems("hsc_read_param_time_out", 38, true) },
          { id: "g3_zone", title: "Зоны (zone_no[38])", items: generateIndexedItems("hsc_read_param_zone_no", 38, true) }
        ]
      },
      {
        id: "group_4",
        title: "Группа 4: l_printf Вывод",
        items: ["l_printf_calls"],
        subgroups: [
          { id: "g4_fmt", title: "Формат (fmt_chek[0-7])", items: generateIndexedItems("l_printf_param_fmt_chek", 8, true) },
          { id: "g4_param", title: "Параметры (param[10])", items: generateIndexedItems("l_printf_param_param", 10, true) },
          { id: "g4_cnt", title: "Счетчик (param_cnt[10])", items: generateIndexedItems("l_printf_param_param_cnt", 10, true) }
        ]
      },
      {
        id: "group_5",
        title: "Группа 5: Абоненты",
        items: ["l_printf_calls"],
        subgroups: [
          { id: "g5_abons", title: "Абоненты (abon[1-14])", items: generateIndexedItems("l_printf_param_abon", 14, false) }
        ]
      }
    ];

    let treeData = JSON.parse(localStorage.getItem('trainer_phrases_data')) || defaultTreeData;

    function saveTreeData() { localStorage.setItem('trainer_phrases_data', JSON.stringify(treeData)); }

    function getAllPhrases(nodes) {
      let list = [];
      nodes.forEach(n => {
        if (n.items) list.push(...n.items);
        if (n.subgroups) list.push(...getAllPhrases(n.subgroups));
      });
      return [...new Set(list)];
    }

    function updateModeSelect() {
      const modeSelect = document.getElementById('modeSelect');
      const cur = modeSelect.value;
      modeSelect.innerHTML = '<option value="all">Все подгруппы</option>';
      function populate(nodes, depth = 0) {
        nodes.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n.id;
          opt.textContent = `${'— '.repeat(depth)}${n.title}`;
          modeSelect.appendChild(opt);
          if (n.subgroups) populate(n.subgroups, depth + 1);
        });
      }
      populate(treeData);
      if (cur && [...modeSelect.options].some(o => o.value === cur)) modeSelect.value = cur;
    }

    function renderTree(nodes, container) {
      container.innerHTML = "";
      nodes.forEach(node => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = `${node.title} (${node.items ? node.items.length : 0})`;
        details.appendChild(summary);

        if (node.items && node.items.length > 0) {
          const grid = document.createElement('div');
          grid.className = 'item-grid';
          node.items.forEach(itemText => {
            const chip = document.createElement('div');
            chip.className = 'item-chip';
            chip.innerHTML = `<span>${itemText}</span><button onclick="speak('${itemText}')">🔊</button>`;
            grid.appendChild(chip);
          });
          details.appendChild(grid);
        }

        if (node.subgroups && node.subgroups.length > 0) renderTree(node.subgroups, details);
        container.appendChild(details);
      });
    }

    // JSON фразы
    document.getElementById('exportPhrasesBtn').onclick = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(treeData, null, 2));
      const a = document.createElement('a');
      a.href = dataStr; a.download = `phrases_${new Date().toISOString().slice(0,10)}.json`;
      a.click(); a.remove();
    };
    document.getElementById('importPhrasesBtn').onclick = () => document.getElementById('phrasesFileInput').click();
    document.getElementById('phrasesFileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = (ev) => {
        try {
          const d = JSON.parse(ev.target.result);
          if (Array.isArray(d)) { treeData = d; saveTreeData(); renderTree(treeData, document.getElementById('tree')); updateModeSelect(); }
        } catch(err) { alert('Ошибка JSON'); }
      };
      r.readAsText(file);
    };

    // Тренировка и Статистика
    let stats = JSON.parse(localStorage.getItem('trainer_advanced_stats')) || { totalTimeSeconds: 0, correctWords: 0, wrongWords: 0, modeCounts: {}, phrasesData: {} };
    function saveStats() { localStorage.setItem('trainer_advanced_stats', JSON.stringify(stats)); }

    let currentPhrase = "", phraseStartTime = 0, isTrainingActive = false;
    const targetDisplay = document.getElementById('targetDisplay');
    const userInput = document.getElementById('userInput');
    const startBtn = document.getElementById('startBtn');
    const feedback = document.getElementById('feedback');
    const recordBanner = document.getElementById('recordBanner');
    const improvementBadge = document.getElementById('improvementBadge');
    const modeSelect = document.getElementById('modeSelect');

    setInterval(() => { if (isTrainingActive) { stats.totalTimeSeconds++; saveStats(); } }, 1000);

    function findNodeById(nodes, id) {
      for (const n of nodes) {
        if (n.id === id) return n;
        if (n.subgroups) { const f = findNodeById(n.subgroups, id); if (f) return f; }
      }
      return null;
    }

    function getPhrasesForCurrentMode() {
      const m = modeSelect.value;
      if (m === 'all') return getAllPhrases(treeData);
      const target = findNodeById(treeData, m);
      return target ? getAllPhrases([target]) : getAllPhrases(treeData);
    }

    function nextPhrase() {
      recordBanner.classList.remove('active');
      improvementBadge.classList.remove('active');
      const available = getPhrasesForCurrentMode();
      if (!available.length) { targetDisplay.textContent = "Пустая группа"; return; }
      currentPhrase = available[Math.floor(Math.random() * available.length)];
      targetDisplay.textContent = currentPhrase;
      userInput.value = "";
      feedback.textContent = "";
      phraseStartTime = Date.now();
      speak(currentPhrase);
    }

    startBtn.onclick = () => {
      isTrainingActive = true;
      userInput.disabled = false;
      userInput.focus();
      startBtn.textContent = "Далее";
      nextPhrase();
    };

    userInput.addEventListener('input', () => {
      if (!isTrainingActive) return;
      const val = userInput.value;

      if (val === currentPhrase) {
        const timeTaken = (Date.now() - phraseStartTime) / 1000;
        if (!stats.phrasesData[currentPhrase]) {
          stats.phrasesData[currentPhrase] = { success: 0, errors: 0, totalTimeSec: 0, minTimeSec: null, recentErrorHistory: [] };
        }
        const pStats = stats.phrasesData[currentPhrase];
        const hadErrorsBefore = pStats.errors > 2;

        pStats.success++;
        pStats.totalTimeSec += timeTaken;
        
        if (!pStats.recentErrorHistory) pStats.recentErrorHistory = [];
        const currentHadError = userInput.dataset.hasError ? 1 : 0;
        pStats.recentErrorHistory.push(currentHadError);

        let isRecord = false;
        if (!pStats.minTimeSec || timeTaken < pStats.minTimeSec) {
          pStats.minTimeSec = timeTaken;
          isRecord = true;
        }

        stats.correctWords++;
        saveStats();

        if (isRecord) recordBanner.classList.add('active');
        feedback.className = "feedback-box text-success";
        feedback.textContent = `✓ Отлично! (${timeTaken.toFixed(1)}s)`;

        if (hadErrorsBefore && currentHadError === 0) {
          improvementBadge.textContent = "📈 Прогресс: Раньше здесь были ошибки, а сейчас введено чисто!";
          improvementBadge.classList.add('active');
        }

        setTimeout(nextPhrase, 1000);
      } 
      else if (!currentPhrase.startsWith(val)) {
        playErrorSound();
        feedback.className = "feedback-box text-danger";
        feedback.textContent = "✖ Ошибка";

        if (!stats.phrasesData[currentPhrase]) {
          stats.phrasesData[currentPhrase] = { success: 0, errors: 0, totalTimeSec: 0, minTimeSec: null, recentErrorHistory: [] };
        }
        if (!userInput.dataset.hasError) {
          stats.phrasesData[currentPhrase].errors++;
          stats.wrongWords++;
          userInput.dataset.hasError = "true";
          saveStats();
        }
      } else {
        feedback.textContent = "";
        delete userInput.dataset.hasError;
      }
    });

    // Озвучка
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voiceSelect');
    let voices = [];
    function populateVoices() {
      voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      voices.forEach(v => {
        const opt = document.createElement('option');
        opt.textContent = `${v.name} (${v.lang})`;
        opt.setAttribute('data-name', v.name);
        voiceSelect.appendChild(opt);
      });
    }
    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;

    function speak(text) {
      if (synth.speaking) synth.cancel();
      const speakText = text.replace(/_/g, ' ').replace(/\[/g, ' ').replace(/\]/g, '');
      const utter = new SpeechSynthesisUtterance(speakText);
      const selectedName = voiceSelect.selectedOptions[0]?.getAttribute('data-name');
      const vObj = voices.find(v => v.name === selectedName);
      if (vObj) utter.voice = vObj;
      synth.speak(utter);
    }

    // Окно статистики
    const statsModal = document.getElementById('statsModal');
    function formatTime(sec) {
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function renderStatsUI() {
      document.getElementById('statTotalTime').textContent = formatTime(stats.totalTimeSeconds);
      document.getElementById('statCorrectWords').textContent = stats.correctWords;
      document.getElementById('statWrongWords').textContent = stats.wrongWords;

      let totalTime = 0, totalCount = 0;
      const tbody = document.getElementById('phrasesTableBody');
      tbody.innerHTML = "";
      const improvedArr = [];

      Object.entries(stats.phrasesData).forEach(([phrase, pData]) => {
        totalTime += pData.totalTimeSec;
        totalCount += pData.success;
        const avg = pData.success > 0 ? (pData.totalTimeSec / pData.success).toFixed(1) : 0;
        const min = pData.minTimeSec ? `${pData.minTimeSec.toFixed(1)}s` : '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-family: monospace;">${phrase}</td>
          <td style="color: var(--success);">${pData.success}</td>
          <td style="color: ${pData.errors > 0 ? 'var(--danger)' : 'inherit'};">${pData.errors}</td>
          <td>${avg}s</td>
          <td style="color: var(--warning);">${min}</td>
        `;
        tbody.appendChild(tr);

        if (pData.errors >= 2 && pData.recentErrorHistory) {
          const rec = pData.recentErrorHistory.slice(-3);
          if (rec.length >= 2 && rec.every(e => e === 0)) {
            improvedArr.push(`• <strong>${phrase}</strong> (Ошибок ранее: ${pData.errors}, сейчас — без ошибок!)`);
          }
        }
      });

      document.getElementById('improvedPhrasesList').innerHTML = improvedArr.length ? improvedArr.join('<br>') : 'Пока нет зафиксированного прогресса.';
      document.getElementById('statAvgTime').textContent = totalCount > 0 ? `${(totalTime / totalCount).toFixed(1)}s` : '0s';
    }

    document.getElementById('openStatsBtn').onclick = () => { renderStatsUI(); statsModal.classList.add('active'); };
    document.getElementById('closeStatsBtn').onclick = () => statsModal.classList.remove('active');
    document.getElementById('resetStatsBtn').onclick = () => {
      if (confirm('Сбросить статистику?')) {
        stats = { totalTimeSeconds: 0, correctWords: 0, wrongWords: 0, modeCounts: {}, phrasesData: {} };
        saveStats(); renderStatsUI();
      }
    };

    renderTree(treeData, document.getElementById('tree'));
    updateModeSelect();
  </script>
</body>
</html>
