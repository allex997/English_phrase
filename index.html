<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tape Deck — тренажёр английского на слух</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181f;
    --panel: #1b2430;
    --panel-2: #212c3a;
    --line: #2c3949;
    --amber: #e8a33d;
    --teal: #3e9b8f;
    --coral: #e5646a;
    --cream: #f2efe9;
    --muted: #8791a1;
    --radius: 16px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  body.theme-cyberpunk {
    --bg: #0d0814; --panel: #160f24; --panel-2: #221638; --line: #3d245c;
    --amber: #ff2a85; --teal: #00f0ff; --coral: #ff0055; --cream: #f5e6ff; --muted: #a080c0;
  }
  body.theme-light {
    --bg: #eef2f5; --panel: #ffffff; --panel-2: #f4f7f9; --line: #d1d9e0;
    --amber: #d97706; --teal: #0d9488; --coral: #e11d48; --cream: #0f172a; --muted: #64748b;
  }
  body.theme-walkman {
    --bg: #0a1128; --panel: #1c2541; --panel-2: #273459; --line: #3a506b;
    --amber: #ffc300; --teal: #4cc9f0; --coral: #f72585; --cream: #edf2f4; --muted: #8d99ae;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: 
      radial-gradient(circle at 15% 0%, rgba(62,155,143,0.12), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(232,163,61,0.12), transparent 45%),
      var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    transition: background 0.4s var(--ease), color 0.4s var(--ease);
  }

  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  #app { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; }

  .reelbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .reel {
    width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--amber); position: relative; flex: none;
    background: repeating-conic-gradient(var(--line) 0deg 15deg, transparent 15deg 90deg);
    transition: transform 0.3s var(--ease);
  }
  .reel::after { content: ""; position: absolute; inset: 36%; background: var(--bg); border-radius: 50%; border: 2px solid var(--amber); }
  .reel.spinning { animation: spin 1.2s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .brand-text .t1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.1; }
  .brand-text .t2 { font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

  .topctrls { display: flex; gap: 6px; }
  .iconbtn {
    background: var(--panel); border: 1px solid var(--line); color: var(--cream);
    width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 17px; transition: all 0.25s var(--ease);
  }
  .iconbtn:hover { transform: translateY(-2px); border-color: var(--amber); }
  .iconbtn.active { border-color: var(--teal); color: var(--teal); background: rgba(62,155,143,0.12); }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    animation: slideUp 0.4s var(--ease) forwards;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .btn {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
    padding: 12px 18px; border-radius: 12px; border: none; cursor: pointer;
    transition: all 0.25s var(--ease); display: inline-flex; align-items: center;
    justify-content: center; gap: 8px; width: 100%;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: scale(0.96); }
  .btn-amber { background: var(--amber); color: #1b1305; }
  .btn-teal { background: var(--teal); color: #08201c; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--cream); }

  label.field-label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  input[type=text], select {
    width: 100%; background: var(--panel-2); border: 1.5px solid var(--line); color: var(--cream);
    padding: 12px 14px; border-radius: 12px; font-size: 15px; font-family: 'Inter', sans-serif;
  }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(232,163,61,0.2); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modegrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .modecard {
    background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 6px;
    text-align: center; cursor: pointer; transition: all 0.25s var(--ease);
  }
  .modecard.sel { border-color: var(--amber); background: rgba(232,163,61,0.12); }
  .modecard .num { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; }
  .modecard .lab { font-size: 10px; color: var(--muted); text-transform: uppercase; }

  .groupchip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 100px; padding: 8px 14px; cursor: pointer; font-size: 13px; margin: 3px 4px 3px 0;
  }
  .groupchip.sel { border-color: var(--teal); background: rgba(62,155,143,0.15); color: var(--teal); }
  
  .subgroupchip {
    display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border: 1.5px dashed var(--line);
    border-radius: 100px; padding: 6px 12px; cursor: pointer; font-size: 12px; margin: 2px 4px 2px 0;
  }
  .subgroupchip.sel { border-color: var(--amber); background: rgba(232,163,61,0.15); color: var(--amber); border-style: solid; }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px 16px; text-align: center; position: relative; }
  .phrase-img-wrap {
    width: 100%; max-width: 320px; height: 180px; margin: 0 auto 12px; border-radius: 16px; overflow: hidden;
    background: var(--panel-2); border: 1px solid var(--line); position: relative; display: flex; align-items: center; justify-content: center;
  }
  .phrase-img { width: 100%; height: 100%; object-fit: cover; }
  .img-loader { position: absolute; inset: 0; background: var(--panel-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  
  .waveform { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 32px; margin: 10px 0; }
  .waveform span { width: 4px; background: var(--teal); border-radius: 2px; height: 6px; opacity: 0.4; }
  .waveform.playing span { animation: wf 0.8s ease-in-out infinite; opacity: 1; }
  @keyframes wf { 0%,100%{height:6px;} 50%{height:28px;} }

  .replaybtn { width: 54px; height: 54px; border-radius: 50%; background: var(--amber); color: #1b1305; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 6px auto 0; }
  .micbtn { width: 68px; height: 68px; border-radius: 50%; background: var(--teal); color: #08201c; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 12px auto; }
  .micbtn.recording { background: var(--coral); color: #fff; animation: micPulse 1s infinite alternate; }
  @keyframes micPulse { from { transform: scale(1); } to { transform: scale(1.1); } }

  .fieldwrap { margin-bottom: 12px; text-align: left; }
  .fieldwrap.correct input { border-color: var(--teal); background: rgba(62,155,143,0.12); }
  .fieldwrap.typo input { border-color: var(--amber); background: rgba(232,163,61,0.12); }
  .fieldwrap.wrong input { border-color: var(--coral); background: rgba(229,100,106,0.12); }
  .wrongreveal { font-size: 12px; color: var(--coral); margin-top: 4px; }

  progress.barra { width: 100%; height: 6px; border-radius: 100px; appearance: none; border: none; }
  progress.barra::-webkit-progress-bar { background: var(--panel-2); }
  progress.barra::-webkit-progress-value { background: linear-gradient(90deg, var(--teal), var(--amber)); }

  .bigpct { font-family: 'IBM Plex Mono', monospace; font-size: 48px; font-weight: 600; line-height: 1; }
  .highscores { background: linear-gradient(135deg, rgba(232,163,61,0.2), rgba(62,155,143,0.2)); border: 2px solid var(--amber); border-radius: 16px; padding: 14px; margin-bottom: 16px; text-align: center; }
  .highscore-badge { background: var(--amber); color: #1b1305; font-weight: 700; padding: 4px 12px; border-radius: 8px; font-size: 12px; text-transform: uppercase; display: inline-block; margin-bottom: 6px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel-2); border: 1px solid var(--amber); color: var(--cream); padding: 10px 18px; border-radius: 100px; font-size: 13px; z-index: 100; opacity: 0; pointer-events: none; transition: all 0.3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  hr.hair { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  .tabbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
  .tab { background: var(--panel-2); border: 1px solid var(--line); border-radius: 100px; padding: 6px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .tab.sel { border-color: var(--amber); color: var(--amber); }
</style>
</head>
<body class="theme-dark">
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const IMG_CACHE_KEY = 'tapedeck_img_cache_v4';
const STATS_KEY = 'tapedeck_stats_v3';
const THEME_KEY = 'tapedeck_theme_v3';

function getImgCache() { try { return JSON.parse(localStorage.getItem(IMG_CACHE_KEY)) || {}; } catch(e){ return {}; } }
function setImgCache(key, val) {
  try {
    const cache = getImgCache(); cache[key] = val;
    localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(cache));
  } catch(e){}
}

function getImageUrl(phraseEn, seed = 0) {
  const cleanPrompt = encodeURIComponent(`minimal vector illustration, flat color, clean art, ${phraseEn}`);
  return `https://image.pollinations.ai/prompt/${cleanPrompt}?width=240&height=140&nologo=true&seed=${seed || phraseEn.length}`;
}

function loadCachedImage(phraseObj, imgElement, loaderElement, fallbackElement) {
  if (phraseObj.customImg) { imgElement.src = phraseObj.customImg; if(loaderElement) loaderElement.style.display = 'none'; return; }
  const cache = getImgCache(), key = phraseObj.en.toLowerCase().trim();
  if (cache[key]) { imgElement.src = cache[key]; if(loaderElement) loaderElement.style.display = 'none'; return; }

  let loaded = false;
  const timer = setTimeout(() => { if(!loaded) { if(loaderElement) loaderElement.style.display='none'; if(fallbackElement) fallbackElement.style.display='block'; } }, 2000);
  imgElement.src = getImageUrl(phraseObj.en);
  imgElement.onload = () => {
    loaded = true; clearTimeout(timer); if(loaderElement) loaderElement.style.display='none';
    try {
      const canvas = document.createElement('canvas'); canvas.width=240; canvas.height=140;
      canvas.getContext('2d').drawImage(imgElement, 0, 0);
      setImgCache(key, canvas.toDataURL('image/jpeg', 0.65));
    } catch(e){}
  };
  imgElement.onerror = () => { loaded = true; clearTimeout(timer); imgElement.style.display='none'; if(loaderElement) loaderElement.style.display='none'; if(fallbackElement) fallbackElement.style.display='block'; };
}

function levenshtein(a, b) {
  const tmp = [];
  for (let i = 0; i <= a.length; i++) tmp[i] = [i];
  for (let j = 0; j <= b.length; j++) tmp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      tmp[i][j] = Math.min(tmp[i - 1][j] + 1, tmp[i][j - 1] + 1, tmp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
  }
  return tmp[a.length][b.length];
}

function checkAnswerFuzzy(given, targetList) {
  const normGiven = normalize(given);
  if (!normGiven) return { status: 'wrong', val: normGiven };
  for (let target of targetList) {
    const normTarget = normalize(target);
    if (normGiven === normTarget) return { status: 'correct', val: normGiven };
    if (levenshtein(normGiven, normTarget) <= (normTarget.length > 7 ? 2 : 1)) {
      return { status: 'typo', val: normGiven, correctTarget: primary(target) };
    }
  }
  return { status: 'wrong', val: normGiven };
}

const DEFAULT_LIBRARY = {
  groups: [
    { name: "Приветствия", sub: ["Общие", "Знакомство"] },
    { name: "Еда и рестораны", sub: ["В кафе", "Заказ счёта"] },
    { name: "Путешествия", sub: ["Город", "Транспорт"] }
  ],
  phrases: [
    { id: 'p1', en: "Hello!", ru: "Привет!", group: "Приветствия", sub: "Общие", customImg: '' },
    { id: 'p2', en: "Good morning", ru: "Доброе утро", group: "Приветствия", sub: "Общие", customImg: '' },
    { id: 'p3', en: "How are you?", ru: "Как дела?", group: "Приветствия", sub: "Общие", customImg: '' },
    { id: 'p4', en: "Nice to meet you", ru: "Приятно познакомиться", group: "Приветствия", sub: "Знакомство", customImg: '' },
    { id: 'p5', en: "I would like a coffee", ru: "Я бы хотел кофе", group: "Еда и рестораны", sub: "В кафе", customImg: '' },
    { id: 'p6', en: "The bill, please", ru: "Счёт, пожалуйста", group: "Еда и рестораны", sub: "Заказ счёта", customImg: '' },
    { id: 'p7', en: "Where is the nearest station?", ru: "Где ближайшая станция?", group: "Путешествия", sub: "Транспорт", customImg: '' },
    { id: 'p8', en: "How much does it cost?", ru: "Сколько это стоит?", group: "Путешествия", sub: "Город", customImg: '' }
  ]
};

const LS_KEY = 'tapedeck_library_v6';
function loadLibrary(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ const p = JSON.parse(raw); if(p && p.phrases && p.groups) return p; }catch(e){} }
  localStorage.setItem(LS_KEY, JSON.stringify(DEFAULT_LIBRARY));
  return JSON.parse(JSON.stringify(DEFAULT_LIBRARY));
}
function saveLibrary(lib){ localStorage.setItem(LS_KEY, JSON.stringify(lib)); }
let LIB = loadLibrary();

function getStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || { bestPct: 0, totalGames: 0, totalTimeSec: 0, modes: {type: 0, speak: 0}, history: [] }; } catch(e) { return { bestPct: 0, totalGames: 0, totalTimeSec: 0, modes: {type:0, speak:0}, history: [] }; }
}
function saveStats(sessionData) {
  const stats = getStats();
  stats.totalGames = (stats.totalGames || 0) + 1;
  stats.totalTimeSec = (stats.totalTimeSec || 0) + sessionData.durationSec;
  stats.modes[sessionData.mode] = (stats.modes[sessionData.mode] || 0) + 1;
  
  stats.history = stats.history || [];
  stats.history.push(sessionData);
  
  let isRecord = false;
  if (sessionData.pct > (stats.bestPct || 0)) { stats.bestPct = sessionData.pct; isRecord = true; }
  localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  return { isRecord, bestPct: stats.bestPct };
}

const SFX = {
  ctx: null, muted: false,
  ensure(){ if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(freq, dur, type='sine', delay=0, vol=0.18){
    if(this.muted) return;
    try {
      const ctx = this.ensure(), t0 = ctx.currentTime + delay, osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0); gain.gain.linearRampToValueAtTime(vol, t0+0.02); gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(t0); osc.stop(t0+dur+0.02);
    } catch(e){}
  },
  correct(){ this.tone(660,0.14,'sine',0); this.tone(880,0.18,'sine',0.1); },
  half(){ this.tone(520,0.16,'triangle',0); },
  wrong(){ this.tone(180,0.25,'sawtooth',0,0.2); this.tone(130,0.3,'sawtooth',0.1,0.18); },
  tick(){ this.tone(1000,0.04,'square',0,0.05); },
  finish(){ [0,1,2,3].forEach((i)=>this.tone(440*Math.pow(2,i/12*4),0.2,'sine',i*0.1,0.12)); }
};

let globalAudioPlayer = new Audio();
globalAudioPlayer.crossOrigin = "anonymous";
function stopAudio() { globalAudioPlayer.pause(); globalAudioPlayer.currentTime = 0; if(window.speechSynthesis) speechSynthesis.cancel(); }
function clearSessionTimer() { if (App.session && App.session.timerId) { clearInterval(App.session.timerId); App.session.timerId = null; } }

function speak(text, lang, onstart, onend) {
  stopAudio();
  if (SFX.muted) { if (onstart) onstart(); setTimeout(() => { if (onend) onend(); }, 400); return; }
  const cleanLang = lang.startsWith('ru') ? 'ru' : 'en', enc = encodeURIComponent(text);
  const src = `https://translate.google.com/translate_tts?ie=UTF-8&q=${enc}&tl=${cleanLang}&client=tw-ob`;
  globalAudioPlayer.src = src;
  globalAudioPlayer.onplay = () => { if (onstart) onstart(); };
  globalAudioPlayer.onended = () => { if (onend) onend(); };
  globalAudioPlayer.onerror = () => { if (onend) onend(); };
  globalAudioPlayer.play().catch(() => { if (onend) onend(); });
}

let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition(); recognition.continuous = false; recognition.interimResults = false;
}

function startListening(onResult) {
  if (!recognition) { toast('Распознавание речи не поддерживается'); return; }
  stopAudio(); recognition.lang = 'en-US';
  recognition.onresult = (e) => { if (onResult) onResult(e.results[0][0].transcript); };
  recognition.onerror = () => toast('Не удалось распознать речь');
  recognition.onend = () => { const b = document.getElementById('micBtn'); if(b) b.classList.remove('recording'); };
  try { recognition.start(); const b = document.getElementById('micBtn'); if(b) b.classList.add('recording'); toast('Слушаю...'); } catch(e) { recognition.stop(); }
}

function normalize(s){ return (s||'').toLowerCase().replace(/ё/g,'е').replace(/[.,!?;:"'()«»\-]/g,'').replace(/\s+/g,' ').trim(); }
function primary(field){ return field.split('/')[0].trim(); }
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatTime(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m} мин ${s} сек` : `${s} сек`;
}

const App = {
  screen: 'home',
  theme: localStorage.getItem(THEME_KEY) || 'theme-dark',
  setup: { count: 30, groups: new Set(), subGroups: new Set(), direction: 'en', timer: 20, mode: 'type' },
  session: null
};

document.body.className = App.theme;

const AppState = {
  render(){
    const el = document.getElementById('app');
    if(App.screen==='home') el.innerHTML = renderHome();
    else if(App.screen==='library') el.innerHTML = renderLibrary();
    else if(App.screen==='stats') el.innerHTML = renderStats();
    else if(App.screen==='game') el.innerHTML = renderGame();
    else if(App.screen==='results') el.innerHTML = renderResults();

    bindGlobal();
    if(App.screen==='home') bindHome();
    if(App.screen==='library') bindLibrary();
    if(App.screen==='stats') bindStats();
    if(App.screen==='game') bindGame();
    if(App.screen==='results') bindResults();
  }
};

function topbar(){
  return `
  <div class="reelbar">
    <div class="brand">
      <div class="reel" id="mainReel"></div>
      <div class="brand-text"><div class="t1">Tape Deck</div><div class="t2">English on ear</div></div>
    </div>
    <div class="topctrls">
      <button class="iconbtn" id="themeBtn" title="Тема">🎨</button>
      <button class="iconbtn ${SFX.muted?'active':''}" id="muteBtn" title="Звук">${SFX.muted?'🔇':'🔊'}</button>
      <button class="iconbtn ${App.screen==='stats'?'active':''}" id="statsBtn" title="Статистика">📊</button>
      <button class="iconbtn ${App.screen==='library'?'active':''}" id="libBtn" title="Библиотека">🗂️</button>
      <button class="iconbtn ${App.screen==='home'?'active':''}" id="homeBtn" title="Главная">🏠</button>
    </div>
  </div>`;
}

function bindGlobal(){
  document.getElementById('themeBtn').onclick = () => {
    const themes = ['theme-dark', 'theme-cyberpunk', 'theme-light', 'theme-walkman'];
    App.theme = themes[(themes.indexOf(App.theme) + 1) % themes.length];
    localStorage.setItem(THEME_KEY, App.theme); document.body.className = App.theme; toast('Тема изменена');
  };
  document.getElementById('muteBtn').onclick = ()=>{ SFX.muted = !SFX.muted; AppState.render(); };

/* ИГРОВОЙ ПРОЦЕСС */
function startGame(){
  let pool = LIB.phrases;
  if(App.setup.groups.size > 0) pool = pool.filter(p => App.setup.groups.has(p.group));
  if(App.setup.subGroups.size > 0) pool = pool.filter(p => App.setup.subGroups.has(p.sub));
  if(pool.length === 0) { toast('Не выбраны фразы для тренировки'); return; }

  let queue = pool.sort(() => Math.random() - 0.5).slice(0, Math.min(App.setup.count, pool.length));

  App.session = {
    queue, idx: 0, results: [], totalScore: 0,
    startedAt: Date.now(), roundStartedAt: Date.now(),
    timerId: null, timeLeft: App.setup.timer, phase: 'answer',
    spoken: null, mode: App.setup.mode
  };
  App.screen = 'game';
  beginRound();
}

function currentPhrase(){ return App.session.queue[App.session.idx]; }

function beginRound(){
  const s = App.session;
  s.phase = 'answer';
  s.timeLeft = App.setup.timer;
  s.roundStartedAt = Date.now();
  s.spoken = s.mode === 'speak' ? 'ru' : (App.setup.direction === 'mix' ? (Math.random() < 0.5 ? 'en' : 'ru') : App.setup.direction);

  AppState.render();
  playRoundAudio();
  startTimer();
}

function playRoundAudio(){
  const s = App.session, p = currentPhrase();
  const text = s.spoken === 'en' ? p.en : primary(p.ru);
  const lang = s.spoken === 'en' ? 'en-US' : 'ru-RU';
  
  const wf = document.getElementById('waveform'), reel = document.getElementById('mainReel');
  if(wf) wf.classList.add('playing'); if(reel) reel.classList.add('spinning');

  speak(text, lang, null, ()=>{ 
    if(wf) wf.classList.remove('playing'); if(reel) reel.classList.remove('spinning');
  });
}

function startTimer(){
  const s = App.session; clearSessionTimer();
  if(App.setup.timer === 0) return;
  s.timerId = setInterval(()=>{
    s.timeLeft -= 1;
    if(s.timeLeft <= 3 && s.timeLeft > 0) SFX.tick();
    const badge = document.getElementById('timerBadge');
    if(badge){ badge.textContent = s.timeLeft + 's'; badge.classList.toggle('warn', s.timeLeft <= 5); }
    if(s.timeLeft <= 0){ clearSessionTimer(); submitAnswer(); }
  }, 1000);
}

function submitAnswer(){
  const s = App.session; if(s.phase !== 'answer') return;
  clearSessionTimer();

  const p = currentPhrase();
  const enInput = (document.getElementById('enInput') || {value: ''}).value;
  const ruInput = (document.getElementById('ruInput') || {value: ''}).value;

  let enCheck = checkAnswerFuzzy(enInput, [p.en]);
  let ruCheck = checkAnswerFuzzy(ruInput, p.ru.split('/'));
  let points = s.spoken === 'ru' ? (enCheck.status === 'correct' ? 1 : enCheck.status === 'typo' ? 0.5 : 0) : ((enCheck.status === 'correct' ? 0.5 : enCheck.status === 'typo' ? 0.25 : 0) + (ruCheck.status === 'correct' ? 0.5 : ruCheck.status === 'typo' ? 0.25 : 0));

  if(points === 1) SFX.correct();
  else if(points >= 0.5) SFX.half();
  else SFX.wrong();

  const phraseTimeSec = Math.round((Date.now() - s.roundStartedAt) / 1000);

  s.totalScore += points;
  s.results.push({ phrase: p, enInput, ruInput, enCheck, ruCheck, points, phraseTimeSec, isWrong: points < 1 });
  s.phase = 'feedback';
  AppState.render();
}

function bindGame(){
  const s = App.session, p = currentPhrase();
  const imgEl = document.getElementById('phraseImg'), loaderEl = document.getElementById('imgLoader'), fallbackEl = document.getElementById('emojiFallback');
  if(imgEl) loadCachedImage(p, imgEl, loaderEl, fallbackEl);

  document.getElementById('replayBtn').onclick = () => playRoundAudio();
  const mic = document.getElementById('micBtn');
  if(mic) mic.onclick = () => startListening((txt) => { const inp = document.getElementById('enInput'); if(inp) inp.value = txt; submitAnswer(); });

  if(s.phase === 'answer'){
    const checkBtn = document.getElementById('checkBtn'); if(checkBtn) checkBtn.onclick = submitAnswer;
    const ru = document.getElementById('ruInput'), en = document.getElementById('enInput');
    if(ru) { ru.focus(); ru.onkeydown = e => { if(e.key==='Enter') { e.preventDefault(); if(en) en.focus(); else submitAnswer(); } }; }
    else if(en && s.mode !== 'speak') en.focus();
    if(en) en.onkeydown = e => { if(e.key==='Enter') { e.preventDefault(); submitAnswer(); } };
  } else {
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn){
      nextBtn.focus();
      nextBtn.onclick = () => {
        s.idx += 1;
        if(s.idx >= s.queue.length){
          stopAudio(); clearSessionTimer(); SFX.finish();
          App.screen = 'results'; AppState.render();
        } else { beginRound(); }
      };
    }
  }
}

  document.querySelectorAll('[data-subtab]').forEach(t => t.onclick = () => { App.libSubTab = decodeURIComponent(t.dataset.subtab); AppState.render(); });

  document.getElementById('newGroupBtn').onclick = () => {
    const name = prompt('Название новой категории:');
    if(name && name.trim()){
      const clean = name.trim();
      if(!LIB.groups.find(g => g.name === clean)){
        LIB.groups.push({ name: clean, sub: ['Общие'] });
        App.libTab = clean; App.libSubTab = 'Общие';
        saveLibrary(LIB); AppState.render();
      }
    }
  };

  document.getElementById('newSubGroupBtn').onclick = () => {
    const name = prompt(`Название подгруппы для «${App.libTab}»:` );
    if(name && name.trim()){
      const cleanSub = name.trim();
      const groupObj = LIB.groups.find(g => g.name === App.libTab);
      if(groupObj && !groupObj.sub.includes(cleanSub)){
        groupObj.sub.push(cleanSub);
        App.libSubTab = cleanSub;
        saveLibrary(LIB); AppState.render();
        toast('Подгруппа добавлена!');
      }
    }
  };

  document.getElementById('addPhraseBtn').onclick = () => {
    const en = document.getElementById('newEn').value.trim();
    const ru = document.getElementById('newRu').value.trim();
    const customImg = document.getElementById('newImg').value.trim();
    if(!en || !ru) return toast('Заполните оба поля');
    LIB.phrases.push({ id: 'p_' + Date.now(), en, ru, group: App.libTab, sub: App.libSubTab || 'Общие', customImg });
    saveLibrary(LIB); AppState.render(); toast('Фраза добавлена!');
  };

  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      LIB.phrases = LIB.phrases.filter(p => p.id !== b.dataset.del);
      saveLibrary(LIB); AppState.render();
    };
  });
}

App.screen = 'home';
AppState.render();
</script>
</body>
</html>
