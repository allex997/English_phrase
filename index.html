<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tape Deck — тренажёр английского на слух</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181f;
    --panel: #1b2430;
    --panel-2: #212c3a;
    --line: #2c3949;
    --amber: #e8a33d;
    --teal: #3e9b8f;
    --coral: #e5646a;
    --cream: #f2efe9;
    --muted: #8791a1;
    --radius: 16px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ТЕМЫ ОФОРМЛЕНИЯ */
  body.theme-cyberpunk {
    --bg: #0d0814;
    --panel: #160f24;
    --panel-2: #221638;
    --line: #3d245c;
    --amber: #ff2a85;
    --teal: #00f0ff;
    --coral: #ff0055;
    --cream: #f5e6ff;
    --muted: #a080c0;
  }

  body.theme-light {
    --bg: #eef2f5;
    --panel: #ffffff;
    --panel-2: #f4f7f9;
    --line: #d1d9e0;
    --amber: #d97706;
    --teal: #0d9488;
    --coral: #e11d48;
    --cream: #0f172a;
    --muted: #64748b;
  }

  body.theme-walkman {
    --bg: #0a1128;
    --panel: #1c2541;
    --panel-2: #273459;
    --line: #3a506b;
    --amber: #ffc300;
    --teal: #4cc9f0;
    --coral: #f72585;
    --cream: #edf2f4;
    --muted: #8d99ae;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  
  body {
    background: 
      radial-gradient(circle at 15% 0%, rgba(62,155,143,0.12), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(232,163,61,0.12), transparent 45%),
      var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
    transition: background 0.4s var(--ease), color 0.4s var(--ease);
  }

  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  #app {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }

  .reelbar {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .reel {
    width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--amber);
    position: relative; flex: none;
    background: repeating-conic-gradient(var(--line) 0deg 15deg, transparent 15deg 90deg);
    transition: transform 0.3s var(--ease);
  }
  .reel::after {
    content: ""; position: absolute; inset: 36%; background: var(--bg);
    border-radius: 50%; border: 2px solid var(--amber);
  }
  .reel.spinning { animation: spin 1.2s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .brand-text .t1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.1; }
  .brand-text .t2 { font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

  .topctrls { display: flex; gap: 6px; }
  .iconbtn {
    background: var(--panel); border: 1px solid var(--line); color: var(--cream);
    width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 17px; transition: all 0.25s var(--ease);
  }
  .iconbtn:hover { transform: translateY(-2px); border-color: var(--amber); }
  .iconbtn:active { transform: scale(0.92); }
  .iconbtn.active { border-color: var(--teal); color: var(--teal); background: rgba(62,155,143,0.12); }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    animation: slideUp 0.4s var(--ease) forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .btn {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
    padding: 12px 18px; border-radius: 12px; border: none; cursor: pointer;
    transition: all 0.25s var(--ease); display: inline-flex; align-items: center;
    justify-content: center; gap: 8px; width: 100%; position: relative; overflow: hidden;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:active { transform: scale(0.96); }
  .btn-amber { background: var(--amber); color: #1b1305; }
  .btn-teal { background: var(--teal); color: #08201c; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--cream); }

  label.field-label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  input[type=text], select {
    width: 100%; background: var(--panel-2); border: 1.5px solid var(--line); color: var(--cream);
    padding: 12px 14px; border-radius: 12px; font-size: 15px; font-family: 'Inter', sans-serif;
    transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }
  input[type=text]:focus, select:focus {
    outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(232,163,61,0.2);
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .modegrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .modecard {
    background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 6px;
    text-align: center; cursor: pointer; transition: all 0.25s var(--ease);
  }
  .modecard:hover { border-color: var(--amber); transform: translateY(-2px); }
  .modecard:active { transform: scale(0.95); }
  .modecard.sel { border-color: var(--amber); background: rgba(232,163,61,0.12); box-shadow: 0 4px 12px rgba(232,163,61,0.2); }
  .modecard .num { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: var(--cream); }
  .modecard .lab { font-size: 10px; color: var(--muted); text-transform: uppercase; }

  .groupchip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 100px; padding: 8px 14px; cursor: pointer; font-size: 13px; margin: 3px 4px 3px 0;
    transition: all 0.25s var(--ease);
  }
  .groupchip:hover { border-color: var(--teal); transform: scale(1.03); }
  .groupchip:active { transform: scale(0.94); }
  .groupchip.sel { border-color: var(--teal); background: rgba(62,155,143,0.15); color: var(--teal); }
  
  .subgroupchip {
    display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border: 1px dashed var(--line);
    border-radius: 100px; padding: 6px 12px; cursor: pointer; font-size: 12px; margin: 2px 4px 2px 0;
    transition: all 0.2s;
  }
  .subgroupchip.sel { border-color: var(--amber); background: rgba(232,163,61,0.15); color: var(--amber); border-style: solid; }

  .tapehead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .counter { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); }
  
  .scorebadge {
    font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600;
    color: var(--amber); background: rgba(232,163,61,0.12); border: 1px solid var(--amber);
    padding: 4px 10px; border-radius: 10px; animation: popIn 0.3s var(--ease);
  }

  .timerbadge {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; border: 1.5px solid var(--line);
    border-radius: 100px; padding: 4px 12px; background: var(--panel); transition: all 0.2s;
  }
  .timerbadge.warn {
    border-color: var(--coral); color: var(--coral); animation: pulse 0.8s infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.6; transform: scale(0.96); } to { opacity: 1; transform: scale(1.05); } }

  .stage {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 20px 16px; text-align: center; position: relative; overflow: hidden;
    animation: slideUp 0.35s var(--ease);
  }
  
  .phrase-img-wrap {
    width: 100%; max-width: 320px; height: 180px; margin: 0 auto 12px;
    border-radius: 16px; overflow: hidden; background: var(--panel-2);
    border: 1px solid var(--line); position: relative; display: flex;
    align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    transition: transform 0.3s var(--ease);
  }
  .phrase-img-wrap:hover { transform: scale(1.02); }
  .phrase-img {
    width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s ease;
  }
  .phrase-img-fallback { font-size: 56px; }
  .img-loader {
    position: absolute; inset: 0; background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace;
  }

  .img-grid-picker {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px;
  }
  .img-grid-item {
    width: 100%; height: 60px; border-radius: 8px; border: 2px solid var(--line);
    object-fit: cover; cursor: pointer; transition: all 0.2s; background: var(--panel);
  }
  .img-grid-item:hover, .img-grid-item.selected {
    border-color: var(--amber); transform: scale(1.08); box-shadow: 0 4px 12px rgba(232,163,61,0.3);
  }

  .waveform { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 32px; margin: 10px 0; }
  .waveform span { width: 4px; background: var(--teal); border-radius: 2px; height: 6px; opacity: 0.4; transition: 0.2s; }
  .waveform.playing span { animation: wf 0.8s ease-in-out infinite; opacity: 1; }
  .waveform span:nth-child(1){animation-delay:0s;} .waveform span:nth-child(2){animation-delay:.1s;}
  .waveform span:nth-child(3){animation-delay:.2s;} .waveform span:nth-child(4){animation-delay:.2s;}
  .waveform span:nth-child(5){animation-delay:.4s;} .waveform span:nth-child(6){animation-delay:.5s;}
  @keyframes wf { 0%,100%{height:6px;} 50%{height:28px;} }

  .replaybtn {
    width: 54px; height: 54px; border-radius: 50%; background: var(--amber); color: #1b1305; border: none;
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 6px auto 0;
    box-shadow: 0 4px 16px rgba(232,163,61,0.3); transition: all 0.25s var(--ease);
  }
  .replaybtn:hover { transform: scale(1.1) rotate(15deg); }
  .replaybtn:active { transform: scale(0.92); }

  /* ГОЛОСОВОЙ ВВОД (РЕЖИМ ПРОИЗНОШЕНИЯ) */
  .micbtn {
    width: 68px; height: 68px; border-radius: 50%; background: var(--teal); color: #08201c; border: none;
    font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 12px auto;
    box-shadow: 0 6px 20px rgba(62,155,143,0.35); transition: all 0.25s var(--ease); position: relative;
  }
  .micbtn:hover { transform: scale(1.08); }
  .micbtn.recording {
    background: var(--coral); color: #fff; animation: micPulse 1s infinite alternate;
  }
  @keyframes micPulse {
    from { box-shadow: 0 0 0 0 rgba(229,100,106,0.7); transform: scale(1); }
    to { box-shadow: 0 0 0 16px rgba(229,100,106,0); transform: scale(1.1); }
  }

  .answers { margin-top: 16px; text-align: left; }
  .fieldwrap { margin-bottom: 12px; transition: all 0.3s var(--ease); }
  .fieldwrap.correct input { border-color: var(--teal); background: rgba(62,155,143,0.12); animation: popIn 0.3s; }
  .fieldwrap.typo input { border-color: var(--amber); background: rgba(232,163,61,0.12); animation: popIn 0.3s; }
  .fieldwrap.wrong input { border-color: var(--coral); background: rgba(229,100,106,0.12); animation: shake 0.4s; }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  @keyframes popIn {
    from { transform: scale(0.95); opacity: 0.7; }
    to { transform: scale(1); opacity: 1; }
  }

  .wrongreveal { font-size: 12px; color: var(--coral); margin-top: 4px; font-weight: 500; }
  .typoreveal { font-size: 12px; color: var(--amber); margin-top: 4px; font-weight: 500; }

  progress.barra {
    width: 100%; height: 6px; border-radius: 100px; overflow: hidden; appearance: none; border: none;
  }
  progress.barra::-webkit-progress-bar { background: var(--panel-2); }
  progress.barra::-webkit-progress-value { background: linear-gradient(90deg, var(--teal), var(--amber)); transition: width 0.4s var(--ease); }

  .bigpct { font-family: 'IBM Plex Mono', monospace; font-size: 54px; font-weight: 600; line-height: 1; }
  .highscores {
    background: linear-gradient(135deg, rgba(232,163,61,0.2), rgba(62,155,143,0.2)); 
    border: 2px solid var(--amber); border-radius: 16px;
    padding: 16px; margin-bottom: 16px; font-size: 14px; text-align: center; 
    animation: popIn 0.4s, recordPulse 2s infinite alternate;
    box-shadow: 0 0 25px rgba(232,163,61,0.3);
  }
  @keyframes recordPulse {
    from { box-shadow: 0 0 10px rgba(232,163,61,0.2); }
    to { box-shadow: 0 0 25px rgba(232,163,61,0.5); }
  }
  .highscore-badge {
    background: var(--amber); color: #1b1305; font-weight: 700; padding: 4px 12px; border-radius: 8px;
    font-size: 12px; text-transform: uppercase; margin-bottom: 6px; display: inline-block;
  }

  .resultrow { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); padding: 12px 0; font-size: 14px; }
  .errcell { flex: 1; }
  .errcell .ok { color: var(--teal); } .errcell .typo { color: var(--amber); } .errcell .given { color: var(--coral); }

  .phraserow { display: grid; grid-template-columns: 1fr 1fr 32px; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .tabbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
  .tab { background: var(--panel-2); border: 1px solid var(--line); border-radius: 100px; padding: 6px 14px; font-size: 13px; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
  .tab.sel { border-color: var(--amber); color: var(--amber); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--amber); color: var(--cream);
    padding: 10px 18px; border-radius: 100px; font-size: 13px; z-index: 100;
    opacity: 0; pointer-events: none; transition: all 0.3s var(--ease); box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  
  hr.hair { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
</style>
</head>
<body class="theme-dark">
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CACHE & FAST IMAGE GENERATION
   ========================================================= */
const IMG_CACHE_KEY = 'tapedeck_img_cache_v3';
const STATS_KEY = 'tapedeck_stats_v3';
const THEME_KEY = 'tapedeck_theme_v2';

function getImgCache() {
  try { return JSON.parse(localStorage.getItem(IMG_CACHE_KEY)) || {}; } catch(e){ return {}; }
}
function setImgCache(key, val) {
  try {
    const cache = getImgCache();
    cache[key] = val;
    localStorage.setItem(IMG_CACHE_KEY, JSON.stringify(cache));
  } catch(e){}
}

function getImageUrl(phraseEn, seed = 0, width = 240, height = 140) {
  const cleanPrompt = encodeURIComponent(`minimal vector illustration, flat color, clean art, ${phraseEn}`);
  const s = seed || (phraseEn.length * 7);
  return `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${width}&height=${height}&nologo=true&seed=${s}`;
}

function preloadSessionImages(queue) {
  queue.forEach(p => {
    if (p.customImg) {
      const img = new Image(); img.src = p.customImg; return;
    }
    const cache = getImgCache();
    const cacheKey = p.en.toLowerCase().trim();
    if (!cache[cacheKey]) {
      const img = new Image();
      const url = getImageUrl(p.en, 0, 240, 140);
      img.src = url;
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 240; canvas.height = 140;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          setImgCache(cacheKey, canvas.toDataURL('image/jpeg', 0.65));
        } catch(e){}
      };
    }
  });
}

function loadCachedImage(phraseObj, imgElement, loaderElement, fallbackElement) {
  if (phraseObj.customImg) {
    imgElement.src = phraseObj.customImg;
    if(loaderElement) loaderElement.style.display = 'none';
    return;
  }

  const cache = getImgCache();
  const cacheKey = phraseObj.en.toLowerCase().trim();

  if (cache[cacheKey]) {
    imgElement.src = cache[cacheKey];
    if(loaderElement) loaderElement.style.display = 'none';
    return;
  }

  let loaded = false;
  const timeoutId = setTimeout(() => {
    if(!loaded) {
      if(loaderElement) loaderElement.style.display = 'none';
      if(fallbackElement) fallbackElement.style.display = 'block';
    }
  }, 2000);

  const src = getImageUrl(phraseObj.en, 0, 240, 140);
  imgElement.src = src;

  imgElement.onload = () => {
    loaded = true;
    clearTimeout(timeoutId);
    if(loaderElement) loaderElement.style.display = 'none';
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 240; canvas.height = 140;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgElement, 0, 0);
      setImgCache(cacheKey, canvas.toDataURL('image/jpeg', 0.65));
    } catch(e){}
  };

  imgElement.onerror = () => {
    loaded = true;
    clearTimeout(timeoutId);
    imgElement.style.display = 'none';
    if(loaderElement) loaderElement.style.display = 'none';
    if(fallbackElement) fallbackElement.style.display = 'block';
  };
}

/* =========================================================
   FUZZY MATCHING (LEVENSHTEIN DISTANCE)
   ========================================================= */
function levenshtein(a, b) {
  const tmp = [];
  let i, j;
  for (i = 0; i <= a.length; i++) { tmp[i] = [i]; }
  for (j = 0; j <= b.length; j++) { tmp[0][j] = j; }
  for (i = 1; i <= a.length; i++) {
    for (j = 1; j <= b.length; j++) {
      tmp[i][j] = Math.min(
        tmp[i - 1][j] + 1,
        tmp[i][j - 1] + 1,
        tmp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
  }
  return tmp[a.length][b.length];
}

function checkAnswerFuzzy(given, targetList) {
  const normGiven = normalize(given);
  if (!normGiven) return { status: 'wrong', val: normGiven };

  for (let target of targetList) {
    const normTarget = normalize(target);
    if (normGiven === normTarget) return { status: 'correct', val: normGiven };
    
    const dist = levenshtein(normGiven, normTarget);
    const maxTypo = normTarget.length > 7 ? 2 : 1;
    
    if (dist <= maxTypo) {
      return { status: 'typo', val: normGiven, correctTarget: primary(target) };
    }
  }
  return { status: 'wrong', val: normGiven };
}

/* =========================================================
   DATA & STATS
   ========================================================= */
const DEFAULT_LIBRARY = {
  groups: [
    { name: "Приветствия", sub: ["Общие", "Знакомство"] },
    { name: "Еда и рестораны", sub: ["В кафе", "Заказ счёта"] },
    { name: "Путешествия", sub: ["Город", "Транспорт"] },
    { name: "Работа и учёба", sub: ["Офис", "Дедлайны"] },
    { name: "Дом и быт", sub: ["Техника", "Уборка"] }
  ],
  phrases: [
    { id: 'p1', en: "Hello!", ru: "Привет!", group: "Приветствия", sub: "Общие", customImg: '' },
    { id: 'p2', en: "Good morning", ru: "Доброе утро", group: "Приветствия", sub: "Общие", customImg: '' },
    { id: 'p3', en: "How are you?", ru: "Как дела?", group: "Приветствия", sub: "Общие", customImg: '' },
    { id: 'p4', en: "Nice to meet you", ru: "Приятно познакомиться", group: "Приветствия", sub: "Знакомство", customImg: '' },
    { id: 'p5', en: "Thank you very much", ru: "Большое спасибо", group: "Приветствия", sub: "Знакомство", customImg: '' },
    { id: 'p6', en: "Excuse me", ru: "Извините", group: "Приветствия", sub: "Общие", customImg: '' },
    { id: 'p7', en: "I would like a coffee", ru: "Я бы хотел кофе", group: "Еда и рестораны", sub: "В кафе", customImg: '' },

function getStats() {
  try { 
    return JSON.parse(localStorage.getItem(STATS_KEY)) || { 
      bestPct: 0, 
      totalGames: 0, 
      totalTimeSeconds: 0, 
      history: [],
      phraseStats: {}, // { phraseEn: { correct: 0, typo: 0, wrong: 0, totalTimeMs: 0, timesCount: 0 } }
      modeCounts: { type: 0, speak: 0 }
    }; 
  } catch(e) { 
    return { bestPct: 0, totalGames: 0, totalTimeSeconds: 0, history: [], phraseStats: {}, modeCounts: { type: 0, speak: 0 } }; 
  }
}

function saveStats(sessionData) {
  const stats = getStats();
  stats.totalGames = (stats.totalGames || 0) + 1;
  stats.totalTimeSeconds = (stats.totalTimeSeconds || 0) + Math.round(sessionData.durationMs / 1000);
  
  stats.history = stats.history || [];
  stats.history.push({ date: new Date().toLocaleDateString(), pct: sessionData.pct, durationMs: sessionData.durationMs });

  stats.modeCounts = stats.modeCounts || { type: 0, speak: 0 };
  if (sessionData.mode === 'speak') stats.modeCounts.speak = (stats.modeCounts.speak || 0) + 1;
  else stats.modeCounts.type = (stats.modeCounts.type || 0) + 1;

  stats.phraseStats = stats.phraseStats || {};
  sessionData.results.forEach(r => {
    const key = r.phrase.en;
    if (!stats.phraseStats[key]) {
      stats.phraseStats[key] = { correct: 0, typo: 0, wrong: 0, totalTimeMs: 0, timesCount: 0 };
    }
    const ps = stats.phraseStats[key];
    ps.totalTimeMs += r.timeSpentMs || 0;
    ps.timesCount += 1;

    if (r.points === 1) ps.correct++;
    else if (r.points > 0) ps.typo++;
    else ps.wrong++;
  });
  
  let isRecord = false;
  if (sessionData.pct > (stats.bestPct || 0)) {
    stats.bestPct = sessionData.pct;
    isRecord = true;
  }
  localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  return { isRecord, bestPct: stats.bestPct, totalGames: stats.totalGames, history: stats.history };
}

const SFX = {
  ctx: null, muted: false,
  ensure(){
    if(!this.ctx){
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(this.ctx.state === 'suspended'){
      this.ctx.resume();
    }
    return this.ctx;
  },
  tone(freq, dur, type='sine', delay=0, vol=0.18){
    if(this.muted) return;
    try {
      const ctx = this.ensure();
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+dur+0.02);
    } catch(e){}
  },
  correct(){ this.tone(660,0.14,'sine',0); this.tone(880,0.18,'sine',0.1); },
  half(){ this.tone(520,0.16,'triangle',0); },
  wrong(){ 
    this.tone(180,0.25,'sawtooth',0,0.2); 
    this.tone(130,0.3,'sawtooth',0.1,0.18); 
  },
  tick(){ this.tone(1000,0.04,'square',0,0.05); },
  finish(){ [0,1,2,3].forEach((i)=>this.tone(440*Math.pow(2,i/12*4),0.2,'sine',i*0.1,0.12)); }
};

let globalAudioPlayer = new Audio();

// Усовершенствованная стабильная функция синтеза речи
function speak(text, lang, onstart, onend) {
  stopAudio();
  if (SFX.muted) {
    if (onstart) onstart();
    setTimeout(() => { if (onend) onend(); }, 400);
    return;
  }

  const cleanLang = lang.startsWith('ru') ? 'ru' : 'en';
  const encodedText = encodeURIComponent(text);
  
  const audioSources = [
    `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=${cleanLang}&client=tw-ob`,
    `https://dict.youdao.com/dictvoice?audio=${encodedText}&le=${cleanLang}`
  ];

  let currentSourceIndex = 0;
  function tryNextSource() {
    if (currentSourceIndex >= audioSources.length) {
      speakFallbackWebSpeech(text, lang, onstart, onend);
      return;
    }
    
    globalAudioPlayer.src = audioSources[currentSourceIndex];
    currentSourceIndex++;

    let triggeredStart = false;
    const triggerStartOnce = () => {
      if (!triggeredStart) {
        triggeredStart = true;
        if (onstart) onstart();
      }
    };

    globalAudioPlayer.onplay = () => { triggerStartOnce(); };
    globalAudioPlayer.onended = () => { if (onend) onend(); };
    globalAudioPlayer.onerror = () => { tryNextSource(); };

    const playPromise = globalAudioPlayer.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        triggerStartOnce();
      }).catch(() => {
        tryNextSource();
      });
    }
  }
  tryNextSource();
}

function speakFallbackWebSpeech(text, lang, onstart, onend) {
  if (!window.speechSynthesis) {
    if (onstart) onstart();
    setTimeout(() => { if (onend) onend(); }, 600);
    return;
  }
  
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; 
    u.rate = 0.9;
    
    let ended = false;
    const done = () => { 
      if (!ended) { 
        ended = true; 
        if (onend) onend(); 
      } 
    };

    u.onstart = () => { if (onstart) onstart(); };
    u.onend = () => done();
    u.onerror = () => done();

    setTimeout(() => {
      try {
        speechSynthesis.speak(u);
      } catch(e) {
        done();
      }
    }, 50);
  } catch(e) {
    if (onstart) onstart();
    setTimeout(() => { if (onend) onend(); }, 500);
  }
}

let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
}

function startListening(onResult, onError) {
  if (!recognition) {
    toast('Распознавание речи не поддерживается браузером');
    return;
  }
  stopAudio();
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    if (onResult) onResult(transcript);
  };
  recognition.onerror = (e) => {
    toast('Не удалось распознать речь');
    if (onError) onError(e);
  };
  recognition.onend = () => {
    const btn = document.getElementById('micBtn');
    if (btn) btn.classList.remove('recording');
  };

  try {
    recognition.start();
    const btn = document.getElementById('micBtn');
    if (btn) btn.classList.add('recording');
    toast('Слушаю... Говорите на английском');
  } catch(e) {
    try { recognition.stop(); } catch(err){}
  }
}

  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

      <div class="mono" style="font-size:15px; color:var(--amber); font-weight:600;">“${escapeHtml(slowestPhrase)}”</div>
    </div>

    <h3 style="font-size:15px; margin:16px 0 8px;">Статистика по фразам и ошибкам</h3>
    <div style="max-height: 220px; overflow-y:auto; padding-right:4px;">

              </div>

function bindStats() {
  document.getElementById('backFromStatsBtn').onclick = () => { App.screen='home'; render(); };
}

/* =========================================================
   GAME ENGINE & LOGIC
   ========================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startGame(){
  clearSessionTimer();
  let pool = LIB.phrases;
  if(App.setup.groups.size > 0) {
    pool = pool.filter(p => App.setup.groups.has(p.group));
  }
  if(App.setup.subGroups.size > 0) {
    pool = pool.filter(p => App.setup.subGroups.has(p.sub));
  }

  if(pool.length===0){ toast('Выбрано 0 фраз по фильтрам'); return; }
  let queue = shuffle(pool);
  let count = Math.min(App.setup.count, queue.length);
  queue = queue.slice(0, count);

  preloadSessionImages(queue);

  App.session = {
    queue, idx: 0, results: [], totalScore: 0, startedAt: Date.now(),
    timerId: null, timeLeft: App.setup.timer, phase: 'answer', spoken: null,
    mode: App.setup.mode, roundStartedAt: Date.now()
  };
  App.screen = 'game';
  beginRound();
}

function currentPhrase(){ return App.session.queue[App.session.idx]; }

function beginRound(){
  const s = App.session;
  s.phase = 'answer';
  s.timeLeft = App.setup.timer;
  s.spoken = s.mode==='speak' ? 'ru' : (App.setup.direction==='mix' ? (Math.random()<0.5?'en':'ru') : App.setup.direction);
  s.roundStartedAt = Date.now();

  render();
  playRoundAudio();
  startTimer();
}

function playRoundAudio(){
  const s = App.session, p = currentPhrase();
  const text = s.spoken==='en' ? p.en : primary(p.ru);
  const lang = s.spoken==='en' ? 'en-US' : 'ru-RU';
  
  const wf = document.getElementById('waveform');
  const reel = document.getElementById('mainReel');
  
  if(wf) wf.classList.add('playing');
  if(reel) reel.classList.add('spinning');

  speak(text, lang, null, ()=>{ 
    const wf2 = document.getElementById('waveform');
    const reel2 = document.getElementById('mainReel');
    if(wf2) wf2.classList.remove('playing');
    if(reel2) reel2.classList.remove('spinning');
  });
}

function startTimer(){
  const s = App.session;
  clearSessionTimer();
  if(App.setup.timer===0) return;

  s.timerId = setInterval(()=>{
    s.timeLeft -= 1;
    if(s.timeLeft <= 3 && s.timeLeft > 0) SFX.tick();

    const badge = document.getElementById('timerBadge');
    if(badge){
      badge.textContent = s.timeLeft + 's';
      badge.classList.toggle('warn', s.timeLeft<=5);
    }

    if(s.timeLeft <= 0){
      clearSessionTimer();
      submitAnswer();
    }
  }, 1000);
}

function submitAnswer(){
  const s = App.session;
  if(s.phase !== 'answer') return;
  clearSessionTimer();

  const timeSpentMs = Date.now() - s.roundStartedAt;
  const p = currentPhrase();
  const enInput = (document.getElementById('enInput')||{value:''}).value;
  const ruInput = (document.getElementById('ruInput')||{value:''}).value;

  let enCheck = checkAnswerFuzzy(enInput, [p.en]);
  let ruCheck = checkAnswerFuzzy(ruInput, p.ru.split('/'));

  let points = 0;

  if (s.spoken === 'ru') {
    points = enCheck.status === 'correct' ? 1 : enCheck.status === 'typo' ? 0.5 : 0;
  } else {
    let enScore = enCheck.status === 'correct' ? 0.5 : enCheck.status === 'typo' ? 0.25 : 0;
    let ruScore = ruCheck.status === 'correct' ? 0.5 : ruCheck.status === 'typo' ? 0.25 : 0;
    points = enScore + ruScore;
  }

  if(points === 1) SFX.correct();
  else if(points >= 0.5) SFX.half();
  else SFX.wrong();

  s.totalScore += points;
  s.results.push({ phrase: p, enInput, ruInput, enCheck, ruCheck, points, spoken: s.spoken, timeSpentMs });
  s.phase = 'feedback';
  render();
}

function renderGame(){
  const s = App.session, p = currentPhrase();
  const total = s.queue.length;
  const isFeedback = s.phase==='feedback';
  const r = isFeedback ? s.results[s.results.length-1] : null;
  const isRuSpoken = s.spoken==='ru';
  const isSpeakMode = s.mode==='speak';

  return `
  ${topbar()}
  <div class="tapehead">
    <div class="counter">Фраза <b style="color:var(--cream);">${s.idx+1}</b> из ${total}</div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div class="scorebadge">${s.totalScore} pts</div>
      <div id="timerBadge" class="timerbadge ${App.setup.timer!==0 && s.timeLeft<=5?'warn':''}">${App.setup.timer===0?'∞':s.timeLeft+'s'}</div>
    </div>
  </div>
  <progress class="barra" value="${s.idx}" max="${total}"></progress>

  <div class="stage" style="margin-top:14px;">
    <div class="phrase-img-wrap">
      <div id="imgLoader" class="img-loader">Загрузка...</div>
      <img id="phraseImg" class="phrase-img" alt="${escapeHtml(p.en)}">
      <div id="emojiFallback" class="phrase-img-fallback" style="display:none;">🗣️</div>
    </div>

    <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;">
      ${isSpeakMode ? 'Озвучьте фразу на английском' : `Озвучено на ${isRuSpoken ? 'русском' : 'английском'}`}
    </div>
    
    <div id="waveform" class="waveform">${Array(6).fill('<span></span>').join('')}</div>
    <button class="replaybtn" id="replayBtn" title="Повторить">🔁</button>

    ${isSpeakMode && !isFeedback ? `
      <button class="micbtn" id="micBtn" title="Нажмите и говорите">🎙️</button>
    ` : ''}

    <div class="answers">
      ${!isRuSpoken ? `
      <div class="fieldwrap ${isFeedback ? r.ruCheck.status : ''}">
        <label class="field-label">Перевод на русском</label>
        <input type="text" id="ruInput" inputmode="text" enterkeyhint="next" ${isFeedback?'disabled':''} value="${isFeedback? escapeHtml(r.ruInput):''}" autocomplete="off">
        ${isFeedback && r.ruCheck.status==='wrong' ? `<div class="wrongreveal">Правильно: ${escapeHtml(primary(p.ru))}</div>` : ''}
        ${isFeedback && r.ruCheck.status==='typo' ? `<div class="typoreveal">Опечатка! Верно: ${escapeHtml(primary(p.ru))} (+0.25)</div>` : ''}
      </div>` : ''}

      <div class="fieldwrap ${isFeedback ? r.enCheck.status : ''}">
        <label class="field-label">${isRuSpoken ? 'Фраза на английском' : 'Повторите на английском'}</label>
        <input type="text" id="enInput" inputmode="text" enterkeyhint="done" ${isFeedback?'disabled':''} value="${isFeedback? escapeHtml(r.enInput):''}" autocomplete="off" placeholder="${isSpeakMode?'Нажмите на микрофон или введите текст...':''}">
        ${isFeedback && r.enCheck.status==='wrong' ? `<div class="wrongreveal">Правильно: ${escapeHtml(p.en)}</div>` : ''}
        ${isFeedback && r.enCheck.status==='typo' ? `<div class="typoreveal">Опечатка! Верно: ${escapeHtml(p.en)} (+0.25)</div>` : ''}
      </div>

      <div style="margin-top:16px;">
        ${!isFeedback ? `
          <button class="btn btn-amber" id="checkBtn">Проверить ✓</button>
        ` : `
          <button class="btn btn-teal" id="nextBtn">${s.idx+1>=total?'Результаты →':'Дальше →'}</button>
        `}
      </div>
    </div>
  </div>`;
}

function bindGame(){
  const s = App.session, p = currentPhrase();
  
  const imgEl = document.getElementById('phraseImg');
  const loaderEl = document.getElementById('imgLoader');
  const fallbackEl = document.getElementById('emojiFallback');
  if(imgEl) {
    loadCachedImage(p, imgEl, loaderEl, fallbackEl);
  }

  document.getElementById('replayBtn').onclick = () => {
    unlockMobileAudio();
    playRoundAudio();
  };

  const micBtn = document.getElementById('micBtn');
  if (micBtn) {
    micBtn.onclick = () => {
      startListening((text) => {
        const enInput = document.getElementById('enInput');
        if (enInput) enInput.value = text;
        submitAnswer();
      });
    };
  }

  if(s.phase==='answer'){
    const checkBtn = document.getElementById('checkBtn');
    if(checkBtn) checkBtn.onclick = submitAnswer;

    const ruInput = document.getElementById('ruInput');
    const enInput = document.getElementById('enInput');

    if(ruInput){
      ruInput.focus();
      ruInput.onkeydown = e => { if(e.key==='Enter') { e.preventDefault(); if(enInput) enInput.focus(); else submitAnswer(); } };
    } else if(enInput){
      if (s.mode !== 'speak') enInput.focus();
    }

    if(enInput){
      enInput.onkeydown = e => { if(e.key==='Enter') { e.preventDefault(); submitAnswer(); } };
    }
  } else {
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn){
      nextBtn.focus();
      nextBtn.onclick = () => {
        unlockMobileAudio();
        s.idx += 1;
        if(s.idx >= s.queue.length){
          stopAudio();
          clearSessionTimer();
          SFX.finish();
          App.screen = 'results';
          render();
        } else {
          beginRound();
        }
      };
    }
  }
}

/* =========================================================
   RESULTS & LIBRARY
   ========================================================= */
function renderResults(){
  const s = App.session;
  const totalPts = s.results.reduce((a,r)=>a+r.points,0);
  const pct = Math.round((totalPts / s.results.length) * 100);
  const mistakes = s.results.filter(r=>r.points<1);
  const color = pct>=85?'var(--teal)':pct>=60?'var(--amber)':'var(--coral)';

  const sessionDurationMs = Date.now() - s.startedAt;
  const statsResult = saveStats({ pct, durationMs: sessionDurationMs, results: s.results, mode: s.mode });

  return `
  ${topbar()}
  <div class="card" style="text-align:center;">
    ${statsResult.isRecord ? `
      <div class="highscores">
        <div class="highscore-badge">🏆 Самый лучший результат!</div>
        <div style="font-weight:600; font-size:16px; color:var(--amber);">Новый абсолютный рекорд точности!</div>
      </div>` : ''}

    <div class="muted" style="text-transform:uppercase;letter-spacing:.1em;font-size:11px;">Точность сессии</div>
    <div class="bigpct" style="color:${color};margin:10px 0;">${pct}%</div>
    <div class="muted mono" style="font-size:13px;">Набрано очков: ${totalPts} / ${s.results.length}</div>
    <hr class="hair">
    <div class="grid2">
      <button class="btn btn-amber" id="replayGameBtn">↻ Ещё раз</button>
      <button class="btn btn-ghost" id="backHomeBtn">В меню</button>
    </div>
  </div>

  ${mistakes.length ? `
  <div class="card">
    <h3 style="margin:0 0 12px;font-size:16px;">Замечания и ошибки (${mistakes.length})</h3>
    ${mistakes.map(r=>`
      <div class="resultrow">
        <div class="errcell">
          <div style="font-weight:600;">${escapeHtml(r.phrase.en)}</div>
          <div class="muted" style="font-size:12px;">${escapeHtml(primary(r.phrase.ru))}</div>
          <div style="margin-top:4px;font-size:12px;">
            ${r.spoken!=='ru'? `<span class="${r.ruCheck.status}">RU: ${r.ruInput? escapeHtml(r.ruInput):'—'}</span> · `:''}
            <span class="${r.enCheck.status}">EN: ${r.enInput? escapeHtml(r.enInput):'—'}</span>
          </div>
        </div>
      </div>`).join('')}
  </div>` : ''}`;
}

function bindResults(){
  document.getElementById('replayGameBtn').onclick = () => {
    unlockMobileAudio();
    startGame();
  };
  document.getElementById('backHomeBtn').onclick = ()=>{ clearSessionTimer(); stopAudio(); App.screen='home'; render(); };
}

function renderLibrary(){
  const activeGroupObj = LIB.groups.find(g => g.name === App.libTab) || LIB.groups[0];
  App.libTab = activeGroupObj.name;
  
  App.libSubTab = App.libSubTab && activeGroupObj.sub.includes(App.libSubTab) ? App.libSubTab : activeGroupObj.sub[0];
  
  const phrasesInTab = LIB.phrases.filter(p => p.group === App.libTab && p.sub === App.libSubTab);

  return `
  ${topbar()}
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="margin:0;font-size:18px;">Библиотека фраз</h2>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-ghost" id="exportJsonBtn" style="padding:6px 10px;font-size:11px;width:auto;" title="Выгрузить в JSON">📤 Экспорт</button>
        <button class="btn btn-ghost" id="importJsonBtn" style="padding:6px 10px;font-size:11px;width:auto;" title="Загрузить из JSON">📥 Импорт</button>
        <input type="file" id="importJsonFile" accept=".json" style="display:none;">
      </div>
    </div>
    
    <div class="tabbar">
      ${LIB.groups.map(g=>`<div class="tab ${g.name===App.libTab?'sel':''}" data-tab="${encodeURIComponent(g.name)}">${g.name}</div>`).join('')}
    </div>

    <div style="display:flex; align-items:center; gap:6px; margin-bottom:12px; flex-wrap:wrap;">
      <span class="muted" style="font-size:11px; text-transform:uppercase;">Подгруппа:</span>
      ${activeGroupObj.sub.map(s => `<div class="subgroupchip ${s===App.libSubTab?'sel':''}" data-subtab="${encodeURIComponent(s)}">${s}</div>`).join('')}
      <button class="btn btn-ghost" id="newSubGroupBtn" style="padding:2px 8px; font-size:11px; width:auto; border-style:dashed;">+ подгруппа</button>
    </div>

    <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
      <button class="btn btn-ghost" id="newGroupBtn" style="padding:4px 10px;font-size:11px;width:auto;">+ Создать категорию</button>
    </div>

    <hr class="hair">
    <div class="grid2">
      <div><label class="field-label">English</label><input type="text" id="newEn" placeholder="Hello"></div>
      <div><label class="field-label">Русский</label><input type="text" id="newRu" placeholder="Привет"></div>
    </div>

    <div style="margin-top:10px;">
      <label class="field-label">Изображение (необязательно)</label>
      <input type="text" id="newImg" placeholder="Вставьте URL или выберите ниже..." value="${escapeHtml(App.selectedCustomImg)}">
      <div style="margin-top:6px;">
        <button class="btn btn-ghost" id="gen5ImagesBtn" style="font-size:12px;padding:6px 12px;">🎲 Показать 5 вариантов картинок</button>
      </div>
      <div class="img-grid-picker" id="imgPickerGrid" style="display:none;"></div>
    </div>

    <button class="btn btn-amber" id="addPhraseBtn" style="margin-top:14px;">+ Добавить слово в «${App.libSubTab}»</button>

    <hr class="hair">
    <div style="max-height: 250px; overflow-y: auto; padding-right: 4px;">
      ${phrasesInTab.length === 0 ? '<div class="muted" style="text-align:center;padding:12px;">В этой подгруппе пока нет фраз</div>' : ''}
      ${phrasesInTab.map(p=>`
        <div class="phraserow">
          <div style="font-weight:500;">${escapeHtml(p.en)}</div>
          <div class="muted">${escapeHtml(p.ru)}</div>
          <button style="background:none;border:none;color:var(--coral);cursor:pointer;font-size:16px;" data-del="${p.id}">✕</button>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function bindLibrary(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ App.libTab = decodeURIComponent(t.dataset.tab); App.libSubTab = null; render(); };
  });

  document.querySelectorAll('[data-subtab]').forEach(t=>{
    t.onclick = ()=>{ App.libSubTab = decodeURIComponent(t.dataset.subtab); render(); };
  });

  document.getElementById('exportJsonBtn').onclick = () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(LIB, null, 2));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", `tapedeck_library_${Date.now()}.json`);
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
    toast('Библиотека успешно выгружена!');
  };

  const importFile = document.getElementById('importJsonFile');
  document.getElementById('importJsonBtn').onclick = () => importFile.click();
  importFile.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if(parsed && parsed.phrases && parsed.groups) {
          LIB = parsed;
          saveLibrary(LIB);
          render();
          toast('Библиотека успешно загружена!');
        } else {
          toast('Ошибка: неверный формат JSON');
        }
      } catch(err) {
        toast('Ошибка чтения файла');
      }
    };
    reader.readAsText(file);
  };

  document.getElementById('newGroupBtn').onclick = ()=>{
    const name = prompt('Название новой категории:');
    if(name && name.trim()){
      const cleanName = name.trim();
      if(!LIB.groups.find(g => g.name === cleanName)) {
        LIB.groups.push({ name: cleanName, sub: ['Общие'] });
        App.libTab = cleanName;
        App.libSubTab = 'Общие';
        saveLibrary(LIB);
        render();
      }
    }
  };

  document.getElementById('newSubGroupBtn').onclick = ()=>{
    const name = prompt(`Название подгруппы для «${App.libTab}»:` );
    if(name && name.trim()){
      const cleanSub = name.trim();
      const groupObj = LIB.groups.find(g => g.name === App.libTab);
      if(groupObj && !groupObj.sub.includes(cleanSub)) {
        groupObj.sub.push(cleanSub);
        App.libSubTab = cleanSub;
        saveLibrary(LIB);
        render();
      }
    }
  };

  document.getElementById('gen5ImagesBtn').onclick = () => {
    const enText = document.getElementById('newEn').value.trim();
    if (!enText) return toast('Сначала введите слово на английском');

    const pickerGrid = document.getElementById('imgPickerGrid');
    pickerGrid.style.display = 'grid';
    pickerGrid.innerHTML = '<div style="grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center;">Генерация 5 вариантов...</div>';

    let html = '';
    for (let i = 1; i <= 5; i++) {
      const url = getImageUrl(enText, i * 42, 120, 120);
      html += `<img src="${url}" class="img-grid-item" data-src="${url}" title="Вариант ${i}" onclick="window.selectCustomImg(this)">`;
    }
    pickerGrid.innerHTML = html;
  };

  document.getElementById('addPhraseBtn').onclick = ()=>{
    const en = document.getElementById('newEn').value.trim();
    const ru = document.getElementById('newRu').value.trim();
    const customImg = document.getElementById('newImg').value.trim();
    if(!en || !ru) return toast('Заполните оба поля');

    LIB.phrases.push({ id: uid(), en, ru, group: App.libTab, sub: App.libSubTab || 'Общие', customImg });
    saveLibrary(LIB);
    App.selectedCustomImg = '';
    render();
    toast('Слово добавлено!');
  };

  document.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{
      LIB.phrases = LIB.phrases.filter(p=>p.id!==b.dataset.del);
      saveLibrary(LIB); render();
    };
  });
}

/* =========================================================
   BOOTSTRAP
   ========================================================= */
App.screen='home';
render();
</script>
